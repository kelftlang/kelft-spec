name: Update compiler specification
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-specification-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Import public compiler inputs
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upstream.mjs --ref main
      - uses: pnpm/action-setup@v5
        if: steps.sync.outputs.changed == 'true'
      - if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.sync.outputs.changed == 'true'
        run: pnpm check && pnpm test && pnpm build:production
      - name: Propose reviewed update
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/propose-update.mjs
